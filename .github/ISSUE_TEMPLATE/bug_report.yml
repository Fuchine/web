name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security vulnerabilities**, do not use this
        form — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs. actual behavior.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Fuchine?
      options:
        - Self-hosted (Docker compose)
        - Self-hosted (pnpm dev / local)
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit SHA or release tag.
      placeholder: e.g. 6e7680a
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Console/server/worker logs. Redact any API keys or secrets.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, browser (if a UI bug), Node version.
      placeholder: e.g. Windows 11, Chrome 120, Node 22
