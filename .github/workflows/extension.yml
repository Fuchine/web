name: Extension

# Builds the browser extension (extension/, WXT, outside the pnpm workspace),
# runs its typecheck + tests and uploads the Chrome zip as a workflow artifact.
# Release: push a tag `ext-vX.Y.Z` matching `version` in extension/package.json,
# then upload the artifact's zip to the Chrome Web Store dashboard.
on:
  push:
    tags: ["ext-v*"]
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (all deps — everything ships in the zip or builds it)
        run: npm audit --audit-level=high

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match extension/package.json version ${pkg}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build + zip (Chrome)
        run: npm run zip

      - name: Show built manifest
        run: cat .output/chrome-mv3/manifest.json

      - name: Upload zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Tag runs: named after the tag; PR runs: after the commit (PR ref names contain '/').
          name: fuchine-importer-chrome-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          path: extension/.output/*-chrome.zip
          # WXT writes to .output/ — a hidden directory, skipped by default.
          include-hidden-files: true
          if-no-files-found: error
