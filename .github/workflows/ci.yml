name: CI

# Fast checks with no database: typecheck the whole monorepo, lint, run the
# unit tests, and build the web app. Runs on every push to main and on PRs. The
# Postgres-backed end-to-end suites live in e2e.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies only; fails on high/critical advisories.
      - name: Audit (production deps)
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (all packages)
        run: pnpm test

      - name: Build (web)
        run: pnpm build
