name: CI

# Fast checks with no database: typecheck the whole monorepo, run the unit
# tests, and build the web app. Runs on every push to main and on PRs. The
# Postgres-backed end-to-end suites live in e2e.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Unit tests (all packages)
        run: pnpm test

      - name: Build (web)
        run: pnpm build
