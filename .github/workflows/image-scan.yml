name: Image scan

# Weekly Trivy scan of the published `latest` images (T2.9). New CVEs land in
# base images and dependencies after a release ships; this surfaces them in the
# Security tab (SARIF, all severities) and fails the run on a CRITICAL that has
# a fix, which is the cue to cut a patch release. Skips cleanly while no image
# has been published yet.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker]

    steps:
      # upload-sarif expects the repository at the workspace path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image reference
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fuchine-${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image is published
        id: exists
        run: |
          if docker manifest inspect "${{ steps.name.outputs.ref }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ steps.name.outputs.ref }} is not published yet; nothing to scan."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy scan (SARIF, all severities)
        if: steps.exists.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.ref }}
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload to code scanning
        if: steps.exists.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Trivy gate (fail on fixable CRITICAL)
        if: steps.exists.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The DB was downloaded by the first scan in this job.
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: ${{ steps.name.outputs.ref }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
