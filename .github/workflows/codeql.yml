name: CodeQL

# Static analysis of the JavaScript/TypeScript code (apps, packages, extension)
# with the security-extended query suite (T2.9). No build step needed:
# build-mode none analyses the sources directly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3" # Wednesdays 04:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
