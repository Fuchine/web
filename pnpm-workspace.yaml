packages:
  - "apps/*"
  - "packages/*"

# Build scripts allowed to run on install (newer pnpm reads this here, not in
# package.json). esbuild (tsx/vite), sharp (next/image), msgpackr (bullmq).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - msgpackr-extract

# Security pins (moved from package.json "pnpm.overrides", which pnpm 10
# ignores). Lockfile already resolves these versions; the override locks them
# in for any future re-resolution.
overrides:
  "nodemailer@<10.1.1": "^10.1.1"
  "esbuild@<0.25.0": ">=0.25.0"
  "postcss@<8.5.23": "^8.5.23"
  "uuid@<11.1.1": ">=11.1.1"
  "@auth/core@<0.41.3": "^0.41.3"
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "browserslist@<4.28.7": "^4.28.7"
  "nanoid@<3.3.18": "^3.3.18"
  "shell-quote@<1.9.0": "^1.9.0"
  "baseline-browser-mapping@<2.11.0": "^2.11.0"
  "sharp@<0.35.5": "^0.35.5"
  "source-map-js@<1.2.2": "^1.2.2"
